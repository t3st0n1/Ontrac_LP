<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#12121A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A849"/>
      <stop offset="100%" stop-color="#B69B6A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#B69B6A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#B69B6A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle dot grid -->
  <g fill="#B69B6A" opacity="0.07">
    <circle cx="60" cy="60" r="1.5"/>
    <circle cx="180" cy="60" r="1.5"/>
    <circle cx="300" cy="60" r="1.5"/>
    <circle cx="420" cy="60" r="1.5"/>
    <circle cx="540" cy="60" r="1.5"/>
    <circle cx="660" cy="60" r="1.5"/>
    <circle cx="780" cy="60" r="1.5"/>
    <circle cx="900" cy="60" r="1.5"/>
    <circle cx="1020" cy="60" r="1.5"/>
    <circle cx="1140" cy="60" r="1.5"/>
  </g>

  <!-- Graph nodes top right -->
  <g transform="translate(820, 80)">
    <line x1="40" y1="50" x2="160" y2="30" stroke="#B69B6A" stroke-width="1" opacity="0.3"/>
    <line x1="40" y1="50" x2="100" y2="140" stroke="#B69B6A" stroke-width="1" opacity="0.3"/>
    <line x1="160" y1="30" x2="240" y2="100" stroke="#B69B6A" stroke-width="1" opacity="0.3"/>
    <line x1="100" y1="140" x2="240" y2="100" stroke="#B69B6A" stroke-width="1" opacity="0.3"/>
    <line x1="240" y1="100" x2="320" y2="180" stroke="#D4A849" stroke-width="1.5" opacity="0.5"/>
    <circle cx="40" cy="50" r="6" fill="#B69B6A"/>
    <circle cx="160" cy="30" r="5" fill="#B69B6A"/>
    <circle cx="100" cy="140" r="5" fill="#B69B6A"/>
    <circle cx="240" cy="100" r="7" fill="#D4A849"/>
    <circle cx="320" cy="180" r="6" fill="#B69B6A"/>
  </g>

  <!-- Logo -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="76" height="76" rx="16" fill="#0A0A0F" stroke="#2A2520" stroke-width="1"/>
    <text x="38" y="52" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="36" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="-1">OT</text>
    <text x="96" y="50" font-family="Playfair Display, Georgia, serif" font-weight="500" font-size="36" fill="#E8E1D6">OnTrac</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="40" height="2" fill="#B69B6A" opacity="0.7"/>
    <text x="56" y="6" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="3" fill="#B69B6A">BLOCKCHAIN FORENSIC INTELLIGENCE</text>
  </g>

  <!-- Headline -->
  <text x="80" y="340" font-family="Playfair Display, Georgia, serif" font-weight="500" font-size="68" fill="#E8E1D6">Every Transaction</text>
  <text x="80" y="420" font-family="Playfair Display, Georgia, serif" font-weight="500" font-style="italic" font-size="68" fill="url(#goldGrad)">Leaves a Trace.</text>

  <!-- Subhead -->
  <text x="80" y="490" font-family="Inter, sans-serif" font-size="22" fill="#8B8575">Inteligência forense on-chain. Da hash ao relatório legal em 60 segundos.</text>

  <!-- Footer line -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#B69B6A" stroke-width="1" opacity="0.3"/>
  <text x="80" y="580" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2" fill="#8B8575">SOLANA FRONTIER HACKATHON 2026</text>
  <text x="1120" y="580" font-family="Inter, sans-serif" font-size="14" text-anchor="end" fill="#8B8575">ontrac.io</text>
</svg>
